<!DOCTYPE html>
<html lang="ko">

<head>

    <meta charset="UTF-8">

    <title>
        로그인
    </title>

</head>


<body>


<h1>
    로그인
</h1>


{% for message in messages %}

    <p>
        {{ message }}
    </p>

{% endfor %}


<form method="post">

    {% csrf_token %}


    <p>

        <label>
            아이디
        </label>

        <input
            type="text"
            name="username"
            required
        >

    </p>


    <p>

        <label>
            비밀번호
        </label>

        <input
            type="password"
            name="password"
            required
        >

    </p>


    <button type="submit">
        로그인
    </button>


</form>


<p>

    회원이 아니신가요?

    <a href="{% url 'signup' %}">
        회원가입
    </a>

</p>


</body>

</html>
